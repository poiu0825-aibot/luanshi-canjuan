<body>
<main class="app">
  <header class="topbar"><div class="brand">亂世殘卷 <span class="muted version-label">v0.21.1</span></div><div class="top-actions"><button id="changelogBtn" class="small">更新內容</button><button id="guideBtn" class="small" aria-expanded="false">說明</button><button id="qualityBtn" class="small" type="button" aria-pressed="false" aria-label="畫質：目前為原畫模式" title="切換為 32×32 像素模式">畫質</button><button id="audioBtn" class="small" aria-label="音效已關閉" title="音效已關閉">🔇</button><button id="saveBtn" class="small" disabled>保存</button><button id="exitBtn" class="small exit-game" hidden>離開</button></div></header>

  <section id="title" class="screen active card cover"><div><p>無名之人，也能留下殘卷</p><h1>亂世殘卷</h1><p>文字探索 × 快速回合戰鬥 × 亂世抉擇</p><div class="stack"><button id="newBtn" class="primary">創立新角色</button><button id="continueBtn">讀取目前槽位</button><button id="slotBtn">管理三個存檔槽</button><button id="titleCodeBtn">匯出／匯入存檔</button></div></div></section>

 generate(floor,depth=1,difficulty='normal'){const region=Content.regions[floor],hard=difficulty==='hard',size=13,last=size-2;RNG.set((Date.now()^(floor*7919)^(depth*1543)^(hard?0x5f3759df:0))>>>0);const grid=Array.from({length:size},()=>Array(size).fill(1));for(let y=1;y<size-1;y++)for(let x=1;x<size-1;x++)grid[y][x]=0;for(let i=0;i<24+floor+depth;i++){const x=RNG.int(1,last),y=RNG.int(1,last);if(x+y>4)grid[y][x]=1}for(let n=1;n<=last;n++){grid[1][n]=0;grid[n][1]=0}grid[2][2]=0;const reachable=this.bfs(grid,1,1),far=[...reachable].map(k=>k.split(',').map(Number)).sort((a,b)=>(b[0]+b[1])-(a[0]+a[1])),exit=far[0]||[last,last],events={},startPos=depth>1?{x:1,y:2}:{x:1,y:1};const spots=far.slice(1).filter(([x,y])=>!(x===startPos.x&&y===startPos.y)&&!(x===1&&y===1)&&!(x===exit[0]&&y===exit[1])),plan=['npc','merchant','recovery','recovery','chest','chest','chest',...Array(4+floor+depth+(hard?3:0)).fill('monster')];for(let i=0;i<Math.min(plan.length,spots.length);i++){const [x,y]=spots[i];events[`${x},${y}`]=plan[i]}const cleared=RegionSystem.stageCleared(floor,depth,difficulty),exitKey=`${exit[0]},${exit[1]}`;if(!cleared)events[exitKey]='boss';else if(depth<3||floor<5)events[exitKey]='exit';if(depth>1)events['1,1']='up';return{floor,depth,difficulty,region:region.key,grid,pos:startPos,seen:{},events,restCount:0,steps:0,seed:RNG.seed,quest:null,bossCleared:cleared,exitKey,mapSize:size}},

 ],
 types:{all:'全部',new:'新增',balance:'平衡',fix:'修正',ui:'介面'},

 age(date){const today=new Date(),then=new Date(date+'T00:00:00');today.setHours(0,0,0,0);const days=Math.max(0,Math.floor((today-then)/86400000));return days===0?'今天':days===1?'昨天':days<30?`${days} 天前`:days<365?`${Math.floor(days/30)} 個月前`:`${Math.floor(days/365)} 年前`},
 open(filter='all'){this.filter=filter;const buttons=Object.entries(this.types).map(([k,n])=>`<button class="${this.filter===k?'active':''}" onclick="ChangeLogSystem.open('${k}')">${n}</button>`).join('');const cards=this.entries.map(e=>{const items=e.items.filter(i=>filter==='all'||i[0]===filter);if(!items.length)return'';return `<section class="release-card"><div class="release-head"><strong>${e.v}</strong><span class="release-age">${e.date}・${this.age(e.date)}</span></div><div class="release-items">${items.map(i=>`<div class="release-item"><span class="change-type change-${i[0]}">${i[1]}</span><span>${i[2]}</span></div>`).join('')}</div></section>`}).join('');UI.modal('更新內容',`<div class="changelog-toolbar">${buttons}</div><div class="changelog-list">${cards}</div>`)}
};
let createState={cls:"",stats:{str:10,vit:10,agi:10,luk:10,spr:10},points:15};
function renderCreate(){const cg=$('#classGrid');cg.innerHTML='';for(const [k,c] of Object.entries(Content.classes)){const b=document.createElement('button');b.classList.toggle('selected',createState.cls===k);b.innerHTML=`<span class="class-icon">${c.icon}</span><strong>${c.name}</strong><br><span class="muted">${c.desc}</span>`;b.onclick=()=>{createState.cls=k;$('#classDesc').textContent=c.desc;renderCreate()};cg.appendChild(b)}const names={str:['力量','STR'],vit:['體力','VIT'],agi:['敏捷','AGI'],luk:['幸運','LUK'],spr:['精神','SPR']},sg=$('#statGrid');sg.innerHTML='';for(const [k,n] of Object.entries(names)){const row=document.createElement('div');row.className='stat-row';row.innerHTML=`<span class="stat-name"><strong>${n[0]}</strong> <span class="muted">${n[1]}</span></span><button aria-label="降低${n[0]}" data-k="${k}" data-d="-1">−</button><strong class="stat-value">${createState.stats[k]}</strong><button aria-label="提高${n[0]}" data-k="${k}" data-d="1">＋</button>`;sg.appendChild(row)}$('#points').textContent=createState.points;$('#startBtn').disabled=!createState.cls||createState.points!==0;$$('#statGrid button').forEach(b=>b.onclick=()=>{const k=b.dataset.k,d=+b.dataset.d;if(d>0&&createState.points>0&&createState.stats[k]<20){createState.stats[k]++;createState.points--}if(d<0&&createState.stats[k]>10){createState.stats[k]--;createState.points++}renderCreate()})}

$('#titleCodeBtn').onclick=()=>{const code=GameState.data?SaveSystem.export():'';UI.modal('匯出／匯入',`<p>${code?'可複製目前進度代碼，或貼上其他代碼匯入。':'目前尚無可匯出的進度；可直接貼上存檔代碼匯入。'}此代碼有完整性校驗，但不是加密。</p><textarea id="saveCode" placeholder="在此貼上存檔代碼">${code}</textarea><div class="actions"><button onclick="copyCode()" ${code?'':'disabled'}>複製</button><button onclick="importCode()">匯入文字框內容</button></div>`)};
const SaveSystem={export(){if(BattleSystem.active)GameState.data.battle=BattleSystem.snapshot();const raw=encodeURIComponent(JSON.stringify(GameState.data)),b64=btoa(raw).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');return `LSCR9.9.${b64}.${this.hash(b64)}`},hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16).padStart(8,'0')},import(code){try{const p=code.trim().split('.'),current=p[0]==='LSCR9'&&p[1]==='9',legacy8=p[0]==='LSCR8'&&p[1]==='8',legacy7=p[0]==='LSCR7'&&p[1]==='7',legacy6=p[0]==='LSCR6'&&p[1]==='6',legacy5=p[0]==='LSCR5'&&p[1]==='5',legacy4=p[0]==='LSCR4'&&p[1]==='4',legacy3=p[0]==='LSCR3'&&p[1]==='3';if(p.length!==4||(!current&&!legacy8&&!legacy7&&!legacy6&&!legacy5&&!legacy4&&!legacy3)||this.hash(p[2])!==p[3])throw Error('格式或校驗碼錯誤');let b=p[2].replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';const d=JSON.parse(decodeURIComponent(atob(b)));if(!d.hero||!Content.classes[d.hero.cls])throw Error('角色資料無效');BattleSystem.stop();GameState.data=GameState.migrate(d);GameState.recalc();GameState.save();UI.close();if(!BattleSystem.resume())UI.renderVillage()}catch(e){alert('匯入失敗：'+e.message)}}};
SaveSystem.export=function(){if(BattleSystem.active)GameState.data.battle=BattleSystem.snapshot();const raw=encodeURIComponent(JSON.stringify(GameState.data)),b64=btoa(raw).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');return `LSCR10.10.${b64}.${this.hash(b64)}`};
const LegacyImport=SaveSystem.import.bind(SaveSystem);SaveSystem.import=function(code){const p=code.trim().split('.');if(!(p[0]==='LSCR10'&&p[1]==='10'))return LegacyImport(code);try{if(p.length!==4||this.hash(p[2])!==p[3])throw Error('格式或校驗碼錯誤');let b=p[2].replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';const d=JSON.parse(decodeURIComponent(atob(b)));if(!d.hero||!Content.classes[d.hero.cls])throw Error('角色資料無效');BattleSystem.stop();GameState.data=GameState.migrate(d);GameState.recalc();GameState.save();UI.close();if(!BattleSystem.resume())UI.renderVillage();UI.toast(`已匯入槽位 ${SlotSystem.active}。`,'good')}catch(e){UI.toast('匯入失敗：'+e.message,'bad')}};

const mapEl=$('#map');let swipeStart=null;
mapEl.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'||!$('#dungeon').classList.contains('active')||!$('#guidePanel').hidden||$('#modal').classList.contains('open'))return;swipeStart={x:e.clientX,y:e.clientY,id:e.pointerId};mapEl.setPointerCapture?.(e.pointerId);e.preventDefault()});
mapEl.addEventListener('pointerup',e=>{if(!swipeStart||swipeStart.id!==e.pointerId)return;const dx=e.clientX-swipeStart.x,dy=e.clientY-swipeStart.y;swipeStart=null;if(Math.max(Math.abs(dx),Math.abs(dy))<22)return;Math.abs(dx)>Math.abs(dy)?DungeonSystem.move(dx>0?1:-1,0):DungeonSystem.move(0,dy>0?1:-1);e.preventDefault()});
mapEl.addEventListener('pointercancel',()=>{swipeStart=null});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#guidePanel').hidden){GuideSystem.close();return}if(!$('#dungeon').classList.contains('active')||$('#modal').classList.contains('open')||!$('#guidePanel').hidden)return;const m={w:[0,-1],W:[0,-1],s:[0,1],S:[0,1],a:[-1,0],A:[-1,0],d:[1,0],D:[1,0]}[e.key];if(m){e.preventDefault();DungeonSystem.move(...m)}});
